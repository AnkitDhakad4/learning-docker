
services:
  backend:
    build: ./backend
    container_name: my-backend
    ports:
      - "3000:3000"
    networks:
      - my-network

  frontend:
    build: ./frontend
    container_name: my-frontend
    ports:
      - "5173:3000"
    networks:
      - my-network

networks:
  my-network:
    driver: bridge
